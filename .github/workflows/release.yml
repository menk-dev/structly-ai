name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: vars.PACKAGES_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: github-packages
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release tag belongs to main
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Structly.AI.slnx --locked-mode
      - run: dotnet format Structly.AI.slnx --verify-no-changes --no-restore
      - run: dotnet build Structly.AI.slnx -c Release --no-restore
      - run: dotnet test --solution Structly.AI.slnx -c Release --no-build
      - run: dotnet run --project examples/Structly.AI.HostingConsumer -c Release --no-build
      - run: dotnet pack src/Structly.AI/Structly.AI.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Structly.AI.Hosting/Structly.AI.Hosting.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Structly.AI.Testing/Structly.AI.Testing.csproj -c Release --no-build -o artifacts/packages
      - name: Validate packed consumer and release version
        run: dotnet run --project tools/Structly.AI.PackageValidation -c Release --no-build -- artifacts/packages "$RELEASE_TAG"
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/packages/* --clobber
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: menk-dev
      - name: Publish packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
      - name: Verify published package with a fresh consumer
        run: |
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir"' EXIT
          version="$(cat version.txt)"
          dotnet new console --framework net10.0 --no-restore --output "$consumer_dir"
          cp examples/Structly.AI.Consumer/*.cs "$consumer_dir/"
          dotnet add "$consumer_dir" package Structly.AI --version "$version" --no-restore
          dotnet add "$consumer_dir" package Structly.AI.Testing --version "$version" --no-restore
          cat > "$consumer_dir/NuGet.Config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          restored=false
          for attempt in $(seq 1 30); do
            if dotnet restore "$consumer_dir" --configfile "$consumer_dir/NuGet.Config" --packages "$consumer_dir/packages" --no-http-cache; then
              restored=true
              break
            fi
            if [ "$attempt" -lt 30 ]; then sleep 20; fi
          done
          [ "$restored" = true ]
          dotnet run --project "$consumer_dir" -c Release --no-restore
